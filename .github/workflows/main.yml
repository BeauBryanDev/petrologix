name: CI

# Gate on master: every push to it, and every PR aimed at it. A green run here
# is the precondition for the deploy stage that comes later.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a branch makes the run already in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 3.13 is what the venv on the dev machine runs. The lithology model
      # arrives as wheels/petrologix-0.2.1-py3-none-any.whl, which pins xgboost,
      # scikit-learn and pandas to the versions its artifact was built against --
      # so the Python version has to be one those wheels publish for.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No network, no API keys: every test is pure logic over the guards, the
      # porosity maths and the curve validator. Anything that would call
      # Anthropic, Qdrant or the embedding endpoint is monkeypatched.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the type check as
      # well as the bundle. `npm run lint` is deliberately not here yet -- see
      # the note in the PR that added this file.
      - name: Build
        working-directory: frontend
        run: npm run build
